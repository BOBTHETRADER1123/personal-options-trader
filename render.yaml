# Test deployment only: Free can sleep and cannot guarantee continuous logging.
# No paid plan, disk, trial, or database is provisioned by this template.
services:
  - type: web
    name: personal-options-trader-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render-managed ingress terminates TLS. This proxy trust setting belongs
    # only behind that ingress; do not copy it into a public direct-port server.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: SESSION_HOURS
        value: "12"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      # Add broker credentials and COMPANION_TOKEN_SHA256 in Render Environment.
      # SQLite must never be used as the cloud source of truth.
